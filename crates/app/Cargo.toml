[package]
name = "app"
version = "0.0.2"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "hush"
path = "src/main.rs"

[features]
femtovg = ["ui/femtovg"]

[dependencies]
anyhow = { workspace = true }
auth = { workspace = true }
catalog = { workspace = true }
kit = { workspace = true }
dotenvy = { workspace = true }
images = { workspace = true }
memory-stats = { workspace = true }
model = { workspace = true }
playback = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
slint = { workspace = true, features = ["unstable-winit-030"] }
store = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread", "sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
souvlaki = { workspace = true }
ui = { workspace = true }
webapi = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = { workspace = true }

[lints]
workspace = true
